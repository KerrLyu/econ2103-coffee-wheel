<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Coffee Wheel: a market game</title>
<style>:root{--navy:#1B2A49;--gold:#C9A227;--cream:#FAF7F0;--paper:#fff;--ink:#222;--mut:#6b6b6b;--line:#E3DCCB;--pos:#1E7A4C;--neg:#B3261E;--demand:#C48A00;--mc:#C0392B;--atc:#2E5E8C;--mr:#8E6BBF}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--cream:#14192A;--paper:#1E2640;--ink:#EDEAE0;--mut:#A8A99F;--line:#33405E;--pos:#58D08F;--neg:#FF8A80;--demand:#F2C14E;--mc:#FF8A7A;--atc:#7DB4EA;--mr:#C3A6F0}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
h1{font:700 34px Cambria,Georgia,serif;margin:6px 0;color:var(--navy)}h2{font:700 20px Cambria,Georgia,serif;margin:0 0 6px;color:var(--navy)}
@media (prefers-color-scheme:dark){h1,h2{color:#F3E7BE}}
p{margin:6px 0}.wrap{max-width:760px;margin:0 auto;padding:0 16px 120px}.hostwrap{max-width:1280px;margin:0 auto;padding:0 16px 60px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;flex-wrap:wrap}
.top .mini{margin-left:10px;font-size:13px;color:var(--mut)}.cum{font:700 20px system-ui}.pos{color:var(--pos)}.neg{color:var(--neg)}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}.pill{font-size:12px;padding:4px 10px;border-radius:99px;background:var(--line);color:var(--mut)}.pill.on{background:var(--navy);color:#fff}.pill.done{background:#CFE5D9;color:#245}
@media (prefers-color-scheme:dark){.pill.on{background:var(--gold);color:#14192A}.pill.done{background:#26493a;color:#cfe}}
.card{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:0 0 14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.card.tight{padding-bottom:10px}.card.center{text-align:center}.cap{font-size:13px;color:var(--mut);margin-bottom:6px}
.r{font:400 13px system-ui;color:var(--mut);margin-left:6px}.timer{float:right;font:700 18px ui-monospace,Menlo,monospace;background:var(--navy);color:#fff;border-radius:8px;padding:1px 10px}.timer.late{background:var(--neg)}
.btn{font:600 16px system-ui;border:2px solid var(--navy);background:var(--paper);color:var(--navy);border-radius:12px;padding:12px 18px;cursor:pointer;min-height:48px}
.btn.primary{background:var(--navy);color:#fff}.btn.primary.locked{background:var(--pos);border-color:var(--pos)}.btn.ghost{background:transparent}.btn.big{width:100%;font-size:18px;padding:16px}.btn:disabled{opacity:.45;cursor:not-allowed}
@media (prefers-color-scheme:dark){.btn{border-color:var(--gold);color:#F3E7BE}.btn.primary{background:var(--gold);color:#14192A}}
.home{max-width:420px;margin:0 auto;padding:36px 16px;text-align:center}.logo{margin-top:10px}.tag{color:var(--mut);margin:0 0 18px}.join{text-align:left}
.join label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}.join input{width:100%;font:600 20px system-ui;padding:12px;border:2px solid var(--line);border-radius:10px;background:var(--cream);color:var(--ink);text-transform:none}
#code{letter-spacing:6px;text-transform:uppercase;text-align:center;font-size:28px}.join .btn{width:100%;margin-top:14px}
.homeLinks{display:grid;gap:10px;margin-top:18px}.fine{font-size:12px;color:var(--mut)}.note{font-size:13px;color:var(--mut);margin-top:8px;text-align:center}
.center{max-width:420px;margin:70px auto;text-align:center;padding:0 16px}.spinner{width:36px;height:36px;margin:0 auto 12px;border:4px solid var(--line);border-top-color:var(--navy);border-radius:50%;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.how{text-align:left;max-width:520px;margin:10px auto}.how li{margin:6px 0}
.chart{width:100%;height:auto;display:block}.chart .grid,.line .grid{stroke:var(--line);stroke-width:1}.chart .axis{stroke:var(--mut);stroke-width:1.4}.tick{font:14px system-ui;fill:var(--mut)}.tick.sub{fill:#9a9a9a;font-size:11px}.line .tick{font-size:10px}
.axt{font:15px system-ui;fill:var(--mut)}.dem{fill:none;stroke:var(--demand);stroke-width:4;stroke-linecap:round}.mr{fill:none;stroke:var(--mr);stroke-width:3;stroke-dasharray:7 5}.mc{fill:none;stroke:var(--mc);stroke-width:3.4}.atc{fill:none;stroke:var(--atc);stroke-width:3.4}
.ghost{fill:none;stroke:#9a9a9a;stroke-width:2.5;stroke-dasharray:3 5}.clab{font:700 15px system-ui}.deml{fill:var(--demand)}.mrl{fill:var(--mr)}.mcl{fill:var(--mc)}.atcl{fill:var(--atc)}.ghostl{fill:#8a8a8a;font-weight:400;font-size:13px}.bestl{fill:var(--pos)}.minl,.brl{fill:var(--navy)}
@media (prefers-color-scheme:dark){.minl,.brl{fill:#F3E7BE}}
.box.win{fill:rgba(30,122,76,.28)}.box.lose{fill:rgba(179,38,30,.28)}.boxlab{font:700 15px system-ui;fill:var(--ink)}.pt{fill:var(--gold);stroke:var(--navy);stroke-width:2.5}.drop{stroke:var(--navy);stroke-width:1.4;stroke-dasharray:4 4;opacity:.65}
.bestring{fill:none;stroke:var(--pos);stroke-width:3.5}.minatc{stroke:var(--navy);stroke-width:1.6;stroke-dasharray:6 5}.brace{stroke:var(--navy);stroke-width:2.2;marker-start:none}
.legend2{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;margin-top:2px}.legend2 span::before{content:"";display:inline-block;width:22px;height:4px;margin-right:6px;vertical-align:middle;border-radius:2px}.dm::before{background:var(--demand)}.mrm::before{background:var(--mr)}.mcm::before{background:var(--mc)}.atm::before{background:var(--atc)}
.sliderrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:8px 0}.sliderrow label{font-size:14px}.sliderrow label.full{flex:0 0 100%;color:var(--mut)}.sliderrow input[type=range]{flex:1 1 160px;height:36px;accent-color:var(--navy)}.sliderrow output{font:700 18px system-ui;min-width:92px;text-align:right}
.read{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-top:6px}.read div{background:var(--cream);border-radius:10px;padding:8px 10px}.read span{display:block;font-size:12px;color:var(--mut)}.read b{font:700 20px system-ui}.read .pf{grid-column:1/-1;text-align:center;border:2px solid var(--line)}.read .pf b{font-size:28px}.read .warn{grid-column:1/-1;background:#FFF1D6;color:#6b4a00}
.actions{display:grid;gap:8px}.actions.sticky{position:sticky;bottom:0;background:linear-gradient(transparent,var(--cream) 22%);padding:16px 0 12px;margin-top:6px}
.wheel{width:100%;max-width:420px;display:block;margin:6px auto}.node .nodeN{font:700 15px system-ui;fill:#1B2A49;pointer-events:none}.node.click{cursor:pointer}.node.click:hover circle:first-child{stroke-width:4}.badge{fill:var(--navy)}.badgeT{font:700 11px system-ui;fill:#fff}.wc1{font:700 16px Cambria,Georgia,serif;fill:var(--navy)}.wc2{font:12px system-ui;fill:var(--mut)}
@media (prefers-color-scheme:dark){.wc1{fill:#F3E7BE}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;justify-content:center;color:var(--mut)}.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.cards{display:grid;gap:8px;margin-bottom:10px}@media (min-width:640px){.cards{grid-template-columns:1fr 1fr}}
.betcard{display:flex;gap:10px;text-align:left;background:var(--paper);border:2px solid var(--line);border-left:7px solid var(--lc);border-radius:12px;padding:10px 12px;cursor:pointer;color:var(--ink);font:inherit}
.betcard.sel{border-color:var(--navy);background:#FFF9E3;box-shadow:0 0 0 2px var(--navy)}@media (prefers-color-scheme:dark){.betcard.sel{background:#2A3355;border-color:var(--gold);box-shadow:0 0 0 2px var(--gold)}}
.betcard .num{font:700 20px Cambria,Georgia,serif;color:var(--lc);min-width:24px}.betcard .bt{display:block}.betcard b{display:block;font-size:16px}.betcard em{display:block;font-size:12px;color:var(--lc);font-style:normal;font-weight:600;margin-bottom:3px}
.betcard .bx{display:block;font-size:14px;color:var(--mut)}.betcard .bx i{color:var(--ink)}.heatline{display:block;margin-top:6px;border-radius:8px;padding:4px 8px;font-size:12.5px;color:#222}
.town,.last{font-size:14px;background:var(--cream);border-radius:8px;padding:6px 10px}
.mine{text-align:center}.mine .big{font:700 40px system-ui}.mine .big small{font:400 14px system-ui;color:var(--mut)}.mine.good .big{color:var(--pos)}.mine.bad .big{color:var(--neg)}.mine .sub{font-size:14px;color:var(--mut);margin-top:4px}
.insight{background:var(--navy);color:#fff;border-radius:14px;padding:14px 16px;margin:0 0 14px;font-size:16px}@media (prefers-color-scheme:dark){.insight{background:#2A3355}}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:14px}.stats div{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}.stats b{display:block;font:700 22px system-ui}.stats span{font-size:12px;color:var(--mut)}
.tablewrap{overflow-x:auto}.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl th{text-align:left;font-size:12px;color:var(--mut);padding:4px 6px;border-bottom:1px solid var(--line)}.tbl td{padding:6px;border-bottom:1px solid var(--line)}.tbl tr.me td{background:#FFF4C9;font-weight:700}@media (prefers-color-scheme:dark){.tbl tr.me td{background:#3a3a1a}}.tbl .outrow td{color:var(--mut)}.bot{font-size:11px;color:var(--mut)}
.lcs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}.line{width:100%;height:auto}.lcline{fill:none;stroke:var(--navy);stroke-width:2.6}.lcdot{fill:var(--gold);stroke:var(--navy);stroke-width:2}.zero{stroke:var(--mut);stroke-width:1.2}.refl{stroke:var(--pos);stroke-width:1.4;stroke-dasharray:5 4}
@media (prefers-color-scheme:dark){.lcline{stroke:#F3E7BE}}
.costs{margin:10px 0 0;text-align:left}.costs summary{cursor:pointer;font-weight:700;color:var(--navy)}@media (prefers-color-scheme:dark){.costs summary{color:#F3E7BE}}.costgrid{display:grid;gap:8px;margin-top:8px;font-size:14px}@media (min-width:700px){.costgrid{grid-template-columns:1fr 1fr}}.costgrid div{background:var(--cream);border-radius:10px;padding:8px 10px}
.debrief{font-size:16px;margin-top:10px}.wait{color:var(--mut);font-size:14px}.teach{background:#FFF4C9;border-radius:8px;padding:8px 12px;color:#3d3300}@media (prefers-color-scheme:dark){.teach{background:#3a3a1a;color:#F3E7BE}}
.hostgrid{display:grid;gap:16px}@media (min-width:980px){.hostgrid{grid-template-columns:1fr 330px;align-items:start}.side{position:sticky;top:10px}}
.codecard{text-align:center}.code{font:700 64px/1 ui-monospace,Menlo,monospace;letter-spacing:10px;color:var(--navy);margin:2px 0}@media (prefers-color-scheme:dark){.code{color:#F3E7BE}}.lab{font-size:12px;color:var(--mut)}.qr{width:170px;margin:8px auto}.qr svg{width:100%;height:auto;background:#fff;border-radius:8px}.url{font-size:12px;word-break:break-all;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.chip{background:var(--cream);border:1px solid var(--line);border-radius:99px;padding:3px 12px;font-size:14px}.chip.ok{background:#DDF1E6;border-color:#9ccdb2;color:#14502f}.chip.off{opacity:.45}
@media (prefers-color-scheme:dark){.chip.ok{background:#1d4a35;color:#cfe}}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:10px 0}.inl{font-size:14px}.inl input[type=number]{width:70px;font:600 16px system-ui;padding:6px;border:2px solid var(--line);border-radius:8px;background:var(--cream);color:var(--ink)}
.progbar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 4px}.progbar i{display:block;height:100%;background:var(--pos);transition:width .3s}
.ctrl{display:grid;gap:10px}details summary{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.warn2{background:#FFF1D6;color:#6b4a00;border-radius:8px;padding:8px 12px;font-size:14px}
.selsum{background:#FFF9E3;border-color:var(--gold);font-size:15px}.warnTxt{color:var(--neg);font-weight:600}@media (prefers-color-scheme:dark){.selsum{background:#2A3355}}
.selmini{font-size:13px;text-align:center;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.lkrow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0;font-size:12px}.lk{padding:2px 8px;border-radius:99px;background:var(--line);color:var(--mut)}.lk.ok{background:#DDF1E6;color:#14502f}.lk.failed{background:#F8D7D3;color:#8a1c14}.nettest{font-size:14px;text-align:left;margin-top:6px}@media (prefers-color-scheme:dark){.lk.ok{background:#1d4a35;color:#cfe}.lk.failed{background:#5a2420;color:#fcc}}
.balnote{background:#FFF6D6;border-radius:10px;padding:8px 10px;margin:8px 0 0}@media (prefers-color-scheme:dark){.balnote{background:#4a3f12}}.reveal{display:block;margin-top:6px}

    s += `<rect x="${X(0)}" y="${Y(top)}" width="${X(o.q) - X(0)}" height="${Math.max(1, Y(bot) - Y(top))}" class="${win ? 'box win' : 'box lose'}"/>`;
    if (Y(bot) - Y(top) > 20 && X(o.q) - X(0) > 70) s += `<text x="${(X(0) + X(o.q)) / 2}" y="${(Y(top) + Y(bot)) / 2 + 4}" text-anchor="middle" class="boxlab">${win ? 'Profit' : 'Loss'}</text>`;
  }
  if (o.ghost) s += `<path d="${curvePath(q => o.ghost.A - o.ghost.B * q, 0, QMAX, X, Y)}" class="ghost"/><text x="${X(0.12)}" y="${Y(o.ghost.A) - 6}" class="clab ghostl">last round's demand</text>`;
  s += `<path d="${curvePath(atcx, 0.3, QMAX, X, Y)}" class="atc"/><path d="${curvePath(mcf, 0, QMAX, X, Y)}" class="mc"/>`;

  s += `<path d="${curvePath(dem, 0, QMAX, X, Y)}" class="dem"/>`;
  // labels

  s += `<text x="${X(QMAX) - 4}" y="${Y(atcx(QMAX)) + 20}" text-anchor="end" class="clab atcl">ATC</text>`;
  if (stage1) s += `<text x="${X(0.2)}" y="${Y(o.flat) + 22}" class="clab deml">Demand = MR = $${o.flat.toFixed(2)}</text>`;
  else {
    const dq = Math.max(1, Math.min(7.2, (A - 1.5) / B)); s += `<text x="${X(dq)}" y="${Y(dem(dq)) + 20}" text-anchor="middle" class="clab deml">Demand</text>`;
    const mq = Math.min(QMAX, Math.max(0.2, (A - 1.2) / (2 * B) * 0.55)); s += `<text x="${X(mq) - 8}" y="${Y(A - 2 * B * mq) + 16}" text-anchor="end" class="clab mrl">MR</text>`;
  }
  if (o.best) {

    s += `<circle cx="${X(o.q)}" cy="${Y(price)}" r="7" class="pt"/>`;

}

  add += `<line x1="${X(q)}" x2="${X(4)}" y1="${Y(0.9)}" y2="${Y(0.9)}" class="brace"/><text x="${(X(q) + X(4)) / 2}" y="${Y(0.9) - 6}" text-anchor="middle" class="clab brl">excess capacity</text>`;
  add += `<line x1="${X(q) - 9}" x2="${X(q) - 9}" y1="${Y(price)}" y2="${Y(mcf(q))}" class="brace"/><text x="${X(q) - 14}" y="${(Y(price) + Y(mcf(q))) / 2 + 4}" text-anchor="end" class="clab brl">markup</text>`;

/* ---------------- geometry: wheel ---------------- */
function heatColor(v) {
  if (v == null) return '#EFE9DC';
  const t = Math.min(1, Math.abs(v) / 400);
  if (v >= 0) { const g = Math.round(235 - 90 * t), r = Math.round(235 - 150 * t), b = Math.round(225 - 120 * t); return `rgb(${r},${g},${b})`; }
  const r = Math.round(245 - 25 * t), g = Math.round(225 - 135 * t), b = Math.round(220 - 140 * t); return `rgb(${r},${g},${b})`;
}
function wheelSVG(o) {
  const S = 360, cx = 180, cy = 180, R = 122, r = 24;
  let s = `<svg viewBox="0 0 ${S} ${S}" class="wheel" role="img" aria-label="Wheel of twelve differentiation bets">`;
  for (let L = 0; L < 4; L++) {
    const a0 = (L * 3 - 0.5) / 12 * 2 * Math.PI - Math.PI / 2 + 0.05, a1 = ((L + 1) * 3 - 0.5) / 12 * 2 * Math.PI - Math.PI / 2 - 0.05, rr = R + 36;
    s += `<path d="M${cx + rr * Math.cos(a0)} ${cy + rr * Math.sin(a0)} A${rr} ${rr} 0 0 1 ${cx + rr * Math.cos(a1)} ${cy + rr * Math.sin(a1)}" stroke="${LEVERS[L].color}" stroke-width="9" fill="none" stroke-linecap="round"/>`;
  }
  s += `<circle cx="${cx}" cy="${cy}" r="${R}" fill="none" stroke="#D9D0BC" stroke-dasharray="3 5"/>`;
  for (let i = 0; i < K; i++) {
    const a = i / 12 * 2 * Math.PI - Math.PI / 2, x = cx + R * Math.cos(a), y = cy + R * Math.sin(a);
    const n = (o.counts && o.counts[i]) || 0; const sel = !!(o.selected && o.selected.indexOf(i) >= 0);
    const fill = o.fill ? o.fill(i) : '#fff';
    s += `<g class="${o.click ? 'node click' : 'node'}" ${o.click ? `onclick="ui.pick(${i})" tabindex="0" role="button" aria-label="Bet ${i + 1}: ${esc(BETS[i].title)}"` : ''}>
      <circle cx="${x}" cy="${y}" r="${sel ? r + 4 : r}" fill="${fill}" stroke="${sel ? '#1B2A49' : LEVERS[BETS[i].lever].color}" stroke-width="${sel ? 4 : 2.5}"/>
      <text x="${x}" y="${y + 5}" text-anchor="middle" class="nodeN">${i + 1}</text>`;
    if (n) s += `<circle cx="${x + 18}" cy="${y - 18}" r="10" class="badge"/><text x="${x + 18}" y="${y - 14}" text-anchor="middle" class="badgeT">${n}</text>`;
    s += '</g>';
  }
  s += `<text x="${cx}" y="${cy - 4}" text-anchor="middle" class="wc1">${esc(o.center1 || '')}</text><text x="${cx}" y="${cy + 14}" text-anchor="middle" class="wc2">${esc(o.center2 || '')}</text>`;
  return s + '</svg>';
}
function leverLegend() { return '<div class="legend">' + LEVERS.map(l => `<span><i style="background:${l.color}"></i>${l.name}</span>`).join('') + '</div>'; }

/* ---------------- results view (host and students) ---------------- */
function insightText(sum) {
  if (sum.stage === 1) return 'Everyone sells the same cup, so no one can charge more than the $6 market price. The best output is 200 cups, where price = MC = ATC, and profit is zero. This is the commodity trap.';
  if (sum.stage === 2) return sum.avgProfit > 20 ? 'Being different pays. A shop with few similar neighbors faces a downward sloping demand, so it can charge above MC and earn a profit. Shops with lookalike neighbors earned less.' : 'Crowded neighbors on the wheel steal customers: demand shifts left and gets flatter, and profit shrinks.';
  if (sum.avgProfit > 25) return 'Profit is an advertisement. Shops are earning more than zero, so outsiders will want in next round, and each entrant will shift everyone\'s demand to the left.';
  if (sum.avgProfit < -25) return 'Losses push shops out. When some shops leave, their customers go to the survivors, whose demand shifts right.';
  return 'Profit is close to zero. Entry and exit have almost balanced out: price is close to ATC, but still above MC.';
}
function resultsHTML(pub, me, isHost) {

      <div class="sub">${sum.stage === 1 ? 'The best you could do: 200 cups at $6.00, profit $0.' : `The best output for your demand was ${Math.round(mine.bestQ * UNIT)} cups (where MR = MC), for ${signed(mine.bestProfit)}.${eff != null ? ' You earned ' + eff + '% of that.' : ''}`}</div>

  rows.forEach(r => { h += `<tr class="${me && r.id === me.id ? 'me' : ''}"><td>${esc(r.name)}${r.bot ? ' <i class="bot">bot</i>' : ''}</td>${sum.stage === 2 ? '<td>' + String.fromCharCode(65 + r.town) + '</td>' : ''}${sum.stage > 1 ? `<td>${esc(betLabel(r.bet))}</td>` : ''}<td>${r.cups}</td><td>${money(r.price, 2)}</td><td class="${r.profit >= 0 ? 'pos' : 'neg'}">${signed(r.profit)}</td></tr>`; });
  R.outs.forEach(o => { h += `<tr class="outrow"><td>${esc(o.name)}</td>${sum.stage === 2 ? '<td></td>' : ''}${sum.stage > 1 ? '<td>stayed out</td>' : ''}<td>-</td><td>-</td><td>$0</td></tr>`; });

function lineChart(title, labels, vals, o) {
  o = o || {}; const W = 320, H = 150, ml = 40, mr = 10, mt = 10, mb = 26; const n = vals.length;
  if (!n) return '';

  const X = i => ml + (n === 1 ? (W - ml - mr) / 2 : i / (n - 1) * (W - ml - mr)), Y = v => mt + (1 - (v - lo) / (hi - lo)) * (H - mt - mb);
  let s = `<div class="lc"><div class="cap">${title}</div><svg viewBox="0 0 ${W} ${H}" class="line">`;
  [lo, (lo + hi) / 2, hi].forEach(v => { s += `<line x1="${ml}" x2="${W - mr}" y1="${Y(v)}" y2="${Y(v)}" class="grid"/><text x="${ml - 5}" y="${Y(v) + 4}" text-anchor="end" class="tick">${o.fmt ? o.fmt(v) : Math.round(v)}</text>`; });
  if (o.zero && lo < 0 && hi > 0) s += `<line x1="${ml}" x2="${W - mr}" y1="${Y(0)}" y2="${Y(0)}" class="zero"/>`;
  if (o.ref != null) s += `<line x1="${ml}" x2="${W - mr}" y1="${Y(o.ref)}" y2="${Y(o.ref)}" class="refl"/><text x="${W - mr}" y="${Y(o.ref) - 3}" text-anchor="end" class="tick">${o.refLabel || ''}</text>`;
  s += `<polyline points="${vals.map((v, i) => X(i) + ',' + Y(v)).join(' ')}" class="lcline"/>` + vals.map((v, i) => `<circle cx="${X(i)}" cy="${Y(v)}" r="4" class="lcdot"/><text x="${X(i)}" y="${H - 8}" text-anchor="middle" class="tick">${labels[i]}</text>`).join('');
  return s + '</svg></div>';
}
function trendHTML(history) {
  const hs = history.filter(h => h.stage >= 2); if (hs.length < 1) return '';
  const labels = hs.map(h => h.stage === 2 ? 'S2.' + h.round : 'S3.' + h.round);
  return '<div class="card"><div class="cap">How the market changed, round by round</div><div class="lcs">' +
    lineChart('Shops open', labels, hs.map(h => h.n), { fmt: v => Math.round(v) }) +
    lineChart('Average profit per shop', labels, hs.map(h => h.avgProfit), { zero: true, fmt: v => signed(v) }) +
    lineChart('Average price per cup', labels, hs.map(h => h.avgPrice), { fmt: v => '$' + v.toFixed(1), ref: 6.08, refLabel: 'long run $6.08' }) + '</div></div>';
}
function finalHTML(pub, me) {
  const hs = pub.history.filter(h => h.stage === 3); const last = hs.length ? hs[hs.length - 1] : null;

    const settle = Math.abs(ap) < 60 ? 'Profit is close to zero because entry and exit pushed each shop\'s demand curve until it just touched ATC.'

  return h;
}

/* ---------------- student render ---------------- */
function studentIntro(pub) {

  if (st === 1) return '<b>Everyone sells the same cup.</b> Customers go to whoever is cheapest, so the market price is $6.00 and you cannot change it. You only choose how many cups to make. Try charging more and see what happens.';
  if (st === 2) return '<b>Make your shop different.</b> Pick 1 to 3 bets on the wheel. Shops with bets near yours are similar to you and share your customers. You compete only with the shops in your own town this stage.';
  return '<b>The towns merge into one market, and anyone can open or close.</b> Each round you may keep your bets, change them, or stay out for a sure $0. Watch the profit estimates: profit pulls shops in, losses push them out.';
}
function renderStudent(keepScroll) {

  uiKey = key; if (!keepScroll) window.scrollTo(0, 0);
  let body = '';
  const hdr = `<header class="top"><div><b>${esc(me.name)}</b><span class="mini">${pub.code === 'SOLO' ? 'solo game' : 'room ' + esc(pub.code)}</span></div><div class="cum ${me.cum >= 0 ? 'pos' : 'neg'}">${signed(me.cum)}</div></header>`;
  const info = stagePills(pub);
  if (pub.phase === 'lobby') {
    body = `<div class="card center"><h2>You're in. Waiting for the game to start.</h2><p>Your instructor will start the first round. In the meantime, here is how the game works.</p>
      <ol class="how"><li><b>Stage 1.</b> Everyone sells the same cup. See what happens to price and profit.</li><li><b>Stage 2.</b> Pick 1 to 3 bets that make your shop different from the others.</li><li><b>Stage 3.</b> The market opens to everyone. Enter, move or stay out, and see where profits end up.</li></ol>${costsPanel()}</div>`;
  } else if (pub.phase === 'bet') {
    if (me.status === 'wait') body = '<div class="card center"><p>You joined while a round was running. You will be dealt in at the next round.</p></div>';
    else if (me.status === 'out' && me.closed) body = `<div class="card center"><h2>Your shop is closed this round.</h2><p>More shops were open than the market can support, and your shop lost the most, so it closed. You earn $0 this round, and your customers went to the shops that stayed. Look at who is where. ${me.closedMore ? 'Your shop stays closed one more round.' : 'If the shops inside earn a profit, you may re-enter next round.'}</p>${wheelSVG({ counts: pub.occupancy.map(a => a.length), center1: pub.nActive + ' shops open' })}${leverLegend()}</div>`;
    else if (me.status === 'out' && me.forced) body = `<div class="card center"><h2>Watch this round.</h2><p>The towns have merged into one market, and it has room for only about half of the shops. The open spots were drawn at random and you did not get one, so you earn $0 this round. Look at who is where. If the shops inside earn a profit, you can try to enter next round.</p>${wheelSVG({ counts: pub.occupancy.map(a => a.length), center1: pub.nActive + ' shops open' })}${leverLegend()}</div>`;
    else body = betView(pub, me);
  } else if (pub.phase === 'quantity') {
    if (me.status === 'wait') body = '<div class="card center"><p>You joined while a round was running. You will be dealt in at the next round.</p></div>';
    else if (me.status === 'out') body = `<div class="card center"><h2>${me.closed ? 'Your shop is closed this round.' : me.forced ? 'You are watching this round.' : 'You are staying out this round.'}</h2><p>No cups, no costs: $0. Here is where the other shops are sitting.</p>${wheelSVG({ counts: pub.occupancy.map(a => a.length), center1: pub.nActive + ' shops' })}${leverLegend()}</div>`;
    else body = qtyView(pub, me);
  } else if (pub.phase === 'results') {
    body = `<div class="card tight"><h2>Round results <span class="r">${STAGE_NAMES[pub.stage]}${pub.stage < 4 ? ', round ' + pub.round + ' of ' + pub.rounds[pub.stage] : ''}</span></h2><p class="wait">Waiting for the instructor to start the next round.</p></div>` + resultsHTML(pub, me, false);
  } else if (pub.phase === 'final') body = finalHTML(pub, me);

  app.innerHTML = `<div class="wrap">${hdr}${info}${body}</div>`;
  if (pub.phase === 'quantity' && me.status === 'in') qtyInit(pub, me);
  patchStudent(); updateDynamic();
}
function patchStudent() {
  const pub = ST.pub, me = ST.me; if (!pub || !me) return;
  const lk = $('#lockbtn');
  if (lk && pub.phase === 'bet') { const same = me.betLocked && sameSet(me.bet, local.slots); lk.disabled = !local.slots.length; lk.textContent = same ? 'Locked in. You can still change until time is called.' : 'Lock in ' + (local.slots.length > 1 ? 'these bets' : 'this bet'); lk.classList.toggle('locked', !!same); }
  if (lk && pub.phase === 'quantity') { lk.textContent = me.qLocked ? 'Locked in. You can still adjust until time is called.' : 'Lock in my output'; lk.classList.toggle('locked', !!me.qLocked); }
  const pg = $('#prog'); if (pg) pg.textContent = pub.progress.locked + ' of ' + pub.progress.total + ' players have locked in';
  updateDynamic();
}
function selSummary(pub, me) {
  const set = local.slots;
  if (!set.length) return '<b>Pick 1 to 3 bets.</b> Each extra bet costs $60 a day, and reaches more customers only if it appeals to different people (bets far apart on the wheel). Tap a bet again to remove it.';
  const rs = me.rivalSets || []; const sit = situation(set, rs, pub.cstar);
  let t = '<b>Your shop: ' + esc(betLabel(set)) + '</b><br>';
  t += set.length > 1 ? `Extra bets cost ${money(60 * (set.length - 1))} a day and reach ${Math.round((sit.r - 1) * 100)}% more customers.` : 'One bet, no extra cost.';
  if (me.heat) { const est = bestFor(sit.A, sit.B, null, sit.extra).profit; t += ` If rivals stay where they were last round, you would earn about <b>${signed(est)}</b> a day.`; }
  else t += ' Rivals have not picked yet: shops with bets near yours will share your customers.';
  if (local.warn) t += `<br><span class="warnTxt">${esc(local.warn)}</span>`;
  return t;
}
function selMini(pub, me) {
  const set = local.slots; if (!set.length) return 'No bet picked yet';
  const sit = situation(set, me.rivalSets || [], pub.cstar);
  let t = set.length + (set.length > 1 ? ' bets' : ' bet') + (set.length > 1 ? ' (extra cost ' + money(60 * (set.length - 1)) + ')' : '');
  if (me.heat) t += ', about ' + signed(bestFor(sit.A, sit.B, null, sit.extra).profit) + ' a day if rivals stay put';
  return t;
}
function betView(pub, me) {
  const st = pub.stage;
  if (uiKey.indexOf('-bet-') === -1 || local.slotKey !== pub.stage + '-' + pub.round) { local.slots = Array.isArray(me.bet) ? me.bet.slice() : []; local.slotKey = pub.stage + '-' + pub.round; local.warn = ''; }
  const heat = me.heat; const cnt = pub.occupancy.map(a => a.length);
  const last = pub.history.length ? pub.history[pub.history.length - 1] : null;
  let h = `<div class="card tight"><h2>${STAGE_NAMES[st]}, round ${pub.round} of ${pub.rounds[st]} ${timerHTML(pub)}</h2><p>${studentIntro(pub)}</p>
    ${st === 2 && me.mates.length ? `<p class="town">Your town this stage: <b>${me.mates.map(esc).join(', ')}</b> and you.</p>` : ''}
    ${st === 3 && pub.reveal ? `<p class="balnote">${balanceNote(pub)}</p>` : ''}
    ${last && st >= 2 && last.stage >= 2 ? `<p class="last">Last round: <b>${last.n}</b> shops, average profit <b>${signed(last.avgProfit)}</b> a day.</p>` : ''}</div>`;
  h += `<div class="card"><div class="cap">${heat ? 'The wheel as it was last round. Color shows what a shop would earn at each spot as its only bet if rivals stay put (green profit, red loss).' : 'The wheel. Bets next to each other are similar, so shops there compete harder.'}</div>`;
  h += wheelSVG({ counts: cnt, selected: local.slots, click: true, fill: i => heat ? heatColor(heat[i].profit) : '#fff', center1: local.slots.length ? local.slots.length + (local.slots.length > 1 ? ' bets' : ' bet') : 'Pick bets', center2: local.slots.length === 1 ? BETS[local.slots[0]].short : '' }) + leverLegend() + '</div>';
  h += `<div class="card selsum" id="selsum">${selSummary(pub, me)}</div>`;
  h += betCards(me, heat, local.slots, pub.occupancy);
  h += `<div class="actions sticky"><div class="selmini">${esc(selMini(pub, me))}</div><button id="lockbtn" class="btn primary" onclick="ui.lockBet()" ${local.slots.length ? '' : 'disabled'}>Lock in this bet</button>${st === 3 ? '<button class="btn ghost" onclick="ui.stayOut()">Stay out this round ($0)</button>' : ''}<div class="note" id="prog"></div></div>`;
  return h;
}
function qtyView(pub, me) {
  const info = me.info; const st = pub.stage;
  let h = `<div class="card tight"><h2>${STAGE_NAMES[st]}, round ${pub.round} of ${pub.rounds[st]} ${timerHTML(pub)}</h2>`;
  if (st === 1) h += `<p>${studentIntro(pub)}</p>`;
  else h += `<p>Your ${Array.isArray(me.bet) && me.bet.length > 1 ? 'bets' : 'bet'}: <b>${Array.isArray(me.bet) ? esc(betLabel(me.bet)) : ''}</b>${info && info.extra ? ` (extra bets add ${money(info.extra * UNIT)} to your fixed cost)` : ''}. Rivals near you have shaped your demand curve. Slide to choose how many cups to make. Your price is read off the demand curve. Look for where MR crosses MC.</p>`;
  h += '</div>';
  h += `<div class="card" id="chartbox"></div>`;
  h += `<div class="card"><div class="cap">How many cups will you make today?</div>
    <div class="sliderrow"><input id="qs" type="range" min="0" max="400" step="10" value="${local.cups}" aria-label="Cups per day"><output id="qv"></output></div>
    ${st === 1 ? `<div class="sliderrow"><label for="ps" class="full">Try a different price. Customers can walk next door to the identical cups.</label><input id="ps" type="range" min="3" max="10" step="0.25" value="${local.price}"><output id="pv"></output></div>` : ''}
    <div class="read" id="readout"></div></div>`;
  h += `<div class="actions sticky"><button id="lockbtn" class="btn primary" onclick="ui.lockQ()">Lock in my output</button><div class="note" id="prog"></div></div>`;
  h += costsPanel();
  return h;
}
function qtyInit(pub, me) {
  const st = pub.stage, info = me.info;
  local.cups = me.q != null ? Math.round(me.q * UNIT) : 100; local.price = MKT_PRICE;
  const qs = $('#qs'); qs.value = local.cups;
  const redraw = () => {
    const q = local.cups / UNIT; const price = st === 1 ? local.price : Math.max(0, info.A - info.B * q);
    const sold = st === 1 ? (price > MKT_PRICE + 1e-9 ? 0 : q) : q;
    const ex = st === 1 ? 0 : info.extra;
    const profit = UNIT * profitModel(sold, price, ex);
    $('#qv').textContent = local.cups + ' cups';
    if (st === 1) $('#pv').textContent = money(local.price, 2);
    $('#chartbox').innerHTML = (st === 1 ? chartSVG({ flat: local.price > MKT_PRICE ? MKT_PRICE : local.price, q: sold > 0 ? sold : 0.001, price: local.price, A: 0, B: 0 }) : chartSVG({ A: info.A, B: info.B, extra: info.extra, q, ghost: me.prevAB && me.prevAB.A != null && me.log.length ? me.prevAB : null })) + `<div class="legend2"><span class="dm">Demand</span>${st === 1 ? '' : '<span class="mrm">MR</span>'}<span class="mcm">MC</span><span class="atm">ATC</span></div><div class="fine">The small gray numbers under the axis are Q on the lecture slides (1 unit = 50 cups).</div>`;
    $('#readout').innerHTML = `<div><span>Price</span><b>${money(price, 2)}</b></div><div><span>Cups sold</span><b>${Math.round(sold * UNIT)}</b></div><div><span>Revenue</span><b>${money(UNIT * price * sold)}</b></div><div><span>Cost</span><b>${money(UNIT * (tcf(sold) + ex))}</b></div><div class="pf ${profit >= 0 ? 'pos' : 'neg'}"><span>Profit today</span><b>${signed(profit)}</b></div>`;
    if (st === 1 && local.price > MKT_PRICE + 1e-9) $('#readout').insertAdjacentHTML('beforeend', '<div class="warn">Customers walk next door to the identical $6.00 cup. You sell nothing and still pay your $400 fixed cost.</div>');
  };
  local.redraw = redraw; redraw();
  const sendDraft = () => { clearTimeout(draftTimer); draftTimer = setTimeout(() => send({ t: ST.me.qLocked ? 'lockq' : 'draft', q: local.cups / UNIT, price: local.price }), 250); };
  qs.addEventListener('input', () => { local.cups = +qs.value; redraw(); sendDraft(); });
  const ps = $('#ps'); if (ps) ps.addEventListener('input', () => { local.price = +ps.value; redraw(); sendDraft(); });
  send({ t: 'draft', q: local.cups / UNIT, price: local.price });
}

/* ---------------- host render ---------------- */
function renderHost() {
  if (role !== 'host') return; const pub = engine.publicView(); const code = pub.code;
  const key = [pub.stage, pub.round, pub.phase, local.hostTab].join('-');
  const keep = document.activeElement && document.activeElement.id;
  const url = joinURL(code); let qr = '';
  try { const q = qrcode(0, 'M'); q.addData(url); q.make(); qr = q.createSvgTag({ cellSize: 3, margin: 2, scalable: true }); } catch (e) { }
  const S = engine.S;
  let main = '';
  if (pub.phase === 'lobby') {
    main = `<div class="card"><h2>Waiting for students</h2><p>Students open the link or scan the code, type the room code <b>${esc(code)}</b> and a shop name. ${engine.ids().length} joined so far.</p>
      ${location.protocol === 'file:' ? '<p class="warn2">This page is open as a file on your computer, so the link and QR code will not work for students. Open it from its web address instead.</p>' : ''}
      <div class="chips">${pub.players.map(p => `<span class="chip ${p.connected ? '' : 'off'}">${esc(p.name)}${p.bot ? ' (bot)' : ''}</span>`).join('') || '<i>nobody yet</i>'}</div>
      <div class="row"><button class="btn ghost" onclick="ui.addBots(1)">Add 1 bot shop</button><button class="btn ghost" onclick="ui.addBots(3)">Add 3 bot shops</button>
      <label class="inl">Shops at the long run balance: <input id="nstar" type="number" min="2" max="12" value="${pub.nstar}" onchange="ui.setNstar(this.value)"> <small>(default is half the class)</small></label></div>
      <details><summary>Settings</summary><div class="row"><label class="inl">Seconds to pick a bet <input id="tb" type="number" min="0" max="300" value="${S.timers.bet}" onchange="ui.setTimers()"></label>
      <label class="inl">Seconds to set output <input id="tq" type="number" min="0" max="300" value="${S.timers.quantity}" onchange="ui.setTimers()"></label>
      <label class="inl">Stage 2 rounds <input id="r2" type="number" min="1" max="6" value="${S.rounds[2]}" onchange="ui.setRounds(2,this.value)"></label>
      <label class="inl">Stage 3 rounds <input id="r3" type="number" min="1" max="8" value="${S.rounds[3]}" onchange="ui.setRounds(3,this.value)"></label>
      <label class="inl"><input type="checkbox" ${S.auto ? 'checked' : ''} onchange="ui.setAuto(this.checked)"> Auto advance when time is up</label>
      ${revealToggle(pub)}${closeToggle(pub)}</div></details>
      ${costsPanel()}</div>`;
  } else if (pub.phase === 'bet' || pub.phase === 'quantity') {
    const occ = pub.occupancy; const cnt = occ.map(a => a.length);
    main = `<div class="card"><h2>${STAGE_NAMES[pub.stage]}, round ${pub.round} of ${pub.rounds[pub.stage]} ${timerHTML(pub)} <span class="r">${pub.phase === 'bet' ? 'students are picking bets' : 'students are choosing output'}</span></h2>
      <p>${esc(hostPrompt(pub))}</p>${pub.stage === 3 && pub.phase === 'bet' ? '<p>' + revealToggle(pub) + closeToggle(pub) + '</p>' : ''}<div class="progbar"><i style="width:${pub.progress.total ? pub.progress.locked / pub.progress.total * 100 : 0}%"></i></div><div class="note">${pub.progress.locked} of ${pub.progress.total} students locked in (bots are always locked)</div>
      ${pub.stage > 1 ? wheelSVG({ counts: cnt, center1: pub.occupancyIsPrev ? 'last round' : 'this round', center2: pub.nActive + ' shops' }) + leverLegend() : ''}</div>
      <div class="card"><div class="cap">Who is where</div><div class="chips">${pub.players.map(p => `<span class="chip ${p.locked ? 'ok' : ''} ${p.connected ? '' : 'off'}">${esc(p.name)}${p.bot ? ' (bot)' : ''} ${p.status === 'out' ? '(out)' : p.locked ? '&#10003;' : '...'}</span>`).join('')}</div></div>`;
  } else if (pub.phase === 'results') {
    main = `<div class="card tight"><h2>Round results <span class="r">${STAGE_NAMES[pub.stage]}, round ${pub.round} of ${pub.rounds[pub.stage]}</span></h2><p class="teach">${esc(hostPrompt(pub))}${pub.stage === 3 ? ' (Balance level: about ' + pub.nstar + ' shops; this round ' + pub.results.summary.n + ' were open.)' : ''}</p></div>` + resultsHTML(pub, null, true);
  } else main = finalHTML(pub, null);
  const ctrl = pub.phase === 'final' ? '' : `<div class="card ctrl"><button class="btn primary big" onclick="ui.next()">${esc(pub.nextLabel)}</button>
    ${pub.phase === 'bet' || pub.phase === 'quantity' ? '<button class="btn ghost" onclick="ui.extend(30)">+30 seconds</button>' : ''}
    ${pub.phase !== 'lobby' ? `<label class="inl"><input type="checkbox" ${S.auto ? 'checked' : ''} onchange="ui.setAuto(this.checked)"> auto advance</label>` : ''}</div>`;
  const side = `<aside class="side"><div class="card codecard"><div class="lab">Room code</div><div class="code">${esc(code)}</div><div class="qr">${qr}</div><div class="url">${esc(url)}</div><div class="lkrow">${linkStatusHTML()}</div></div>${ctrl}</aside>`;
  if (key !== uiKey || pub.phase === 'lobby' || pub.phase === 'bet' || pub.phase === 'quantity') { /* always re-render host: no sliders here */ }
  app.innerHTML = `<div class="hostwrap"><header class="top"><div><b>Coffee Wheel</b><span class="mini">instructor</span></div>${stagePills(pub)}</header><div class="hostgrid"><main>${main}</main>${side}</div></div>`;
  uiKey = key; updateDynamic();
}
function closeToggle(pub) {
  return `<label class="inl reveal"><input type="checkbox" ${pub.closeLosers ? 'checked' : ''} onchange="ui.setCloseLosers(this.checked)"> In Stage 3, close the biggest losers for one round when too many shops are open</label>`;
}
function revealToggle(pub) {
  return `<label class="inl reveal"><input type="checkbox" ${pub.reveal ? 'checked' : ''} onchange="ui.setReveal(this.checked)"> Tell students the balance level (about ${pub.nstar} shops) in Stage 3</label>`;
}
function balanceNote(pub) {
  return `Your instructor says this market can support about <b>${pub.nstar} shops</b> at once. With more than that, the average shop loses money; with fewer, the average shop earns a profit. Decide who stays and who sits out.`;
}
function hostPrompt(pub) {
  const st = pub.stage, ph = pub.phase;
  if (ph === 'bet' && st === 3 && pub.round === 1) return 'Tell them: the towns have merged, but the market fits only about ' + pub.nstar + ' shops. About half the class (' + Math.max(2, pub.nstar - 1) + ' spots, drawn at random) starts open; the rest watch round 1 and can enter from round 2. Use the colors: green means a newcomer would profit.';
  if (ph === 'bet' && st === 3 && pub.round > 1 && pub.results && pub.results.closing && pub.results.closing.length) return 'Say: ' + pub.results.closing.length + ' shop' + (pub.results.closing.length > 1 ? 's' : '') + ' with the biggest losses closed, so they are out this round and their customers go to the shops that stayed. Closed shops stay out for two rounds (or until the end of the game). Everyone else: enter, move or stay out, using the colors.';
  if (ph === 'bet') return st === 2 ? 'Tell them: pick 1 to 3 bets that make you different. Bets near other shops share customers, and each extra bet costs $60 a day.' : 'Tell them: use the colors. Green means a newcomer would earn a profit, red means a loss. Everyone else is reading the same map.';
  if (ph === 'quantity') return st === 1 ? 'Ask: can anyone sell more than $6? Try it on your slider. Where is your profit highest?' : 'Ask: where does MR cross MC? Is your price on the demand curve at that quantity?';
  if (st === 1) return 'Ask: why could nobody charge more than $6? (Flat demand: Part 1 slide 10, and the left graph of Part 2 slide 6.)';
  if (st === 2) return 'Ask: who earned the most, and what did they pick? Who had lookalike neighbors? (Downward sloping demand and profit: Part 1 slide 10.)';
  return 'Ask: did shops enter or leave? What happened to the average profit? (Entry squeezes demand left and flatter: Part 1 slides 16 and 18. Exit shifts demand right: Part 2 slide 3.)';
}

/* ---------------- ui actions ---------------- */
const ui = {
  join() {
    const code = ($('#code').value || '').trim().toUpperCase(), name = ($('#name').value || '').trim();
    if (code.length !== 4) { $('#joinmsg').textContent = 'The room code has 4 letters.'; return; }
    if (!name) { $('#joinmsg').textContent = 'Type a shop name first.'; return; }
    startClient(code, name);
  },
  rejoin() { try { const l = JSON.parse(store.get('cw-last')); startClient(l.code, l.name); } catch (e) { } },
  host() { startHost(); }, netTest() { netTest(); }, solo() { const n = ($('#name') && $('#name').value.trim()) || 'You'; startSolo(n); },
  pick(i) {
    if (!ST.me || ST.pub.phase !== 'bet') return;
    const a = local.slots.slice(), ix = a.indexOf(i); local.warn = '';
    if (ix >= 0) a.splice(ix, 1); else if (a.length >= MAX_BETS) local.warn = 'You can pick up to 3 bets. Tap one to remove it first.'; else a.push(i);
    local.slots = sortedSet(a);
    if (local.slots.length) { send({ t: 'bet', slot: local.slots, lock: false }); ST.me.bet = local.slots.slice(); ST.me.betLocked = false; }
    const y = window.scrollY; uiKey = ''; renderStudent(true); window.scrollTo(0, y);
  },
  lockBet() { if (!local.slots.length) return; send({ t: 'bet', slot: local.slots, lock: true }); if (role === 'solo') return engine.next(); const lk = $('#lockbtn'); if (lk) { lk.textContent = 'Locked in. You can still change until time is called.'; lk.classList.add('locked'); } },
  stayOut() { local.slots = []; send({ t: 'bet', slot: 'out', lock: true }); if (role === 'solo') return engine.next(); const lk = $('#lockbtn'); if (lk) lk.textContent = 'You are staying out. Tap a bet to change your mind.'; },
  lockQ() { send({ t: 'lockq', q: local.cups / UNIT, price: local.price }); if (role === 'solo') return engine.next(); const lk = $('#lockbtn'); if (lk) { lk.textContent = 'Locked in. You can still adjust until time is called.'; lk.classList.add('locked'); } },
  next() { engine.next(); }, nextSolo() { engine.next(); }, extend(s) { engine.extend(s); },
  addBots(n) { const used = engine.ids().map(i => engine.P[i].name); const pool = BOT_NAMES.filter(x => !used.includes(x)); for (let i = 0; i < n && pool.length; i++) engine.addPlayer('bot' + Math.random().toString(36).slice(2, 7), pool.shift(), true); },
  setNstar(v) { engine.setNstar(+v); }, setAuto(v) { engine.setAuto(v); }, setReveal(v) { engine.setReveal(v); }, setCloseLosers(v) { engine.setCloseLosers(v); },
  setTimers() { engine.setTimers(+$('#tb').value || 0, +$('#tq').value || 0); }, setRounds(s, v) { engine.setRounds(s, v); }
};
boot();
</script>
